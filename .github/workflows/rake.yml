name: rake

on:
  push:
    branches: [ main, v*, ci-check ]
    tags: [ v* ]
  pull_request:

jobs:
  rspec:
    name: Test on Ruby ${{ matrix.ruby }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4"]
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      BUNDLE_WITHOUT: "secryst"
      SKIP_JS: "1"
      # The ISC corpus sweep (ISC_SWEEP=1) stays opt-in until the
      # conformance gap it measures is closed: it currently exposes real
      # per-map mismatches across the corpus. Run it locally with
      #   ISC_SWEEP=1 INTERSCRIPT_MAPS_PATH=../maps/maps \
      #   rspec spec/interscript_spec.rb
      # to track that gap; flip it on here once it goes green.

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v7
        with:
          repository: interscript/interscript

      - name: Bootstrap packages
        run: ruby bootstrap.rb

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: ruby

      - name: Install Python helper and gems
        working-directory: ruby
        run: |
          bundle config set --local with jsexec
          bundle install
          # PyCall binds whichever libpython it was built against, which
          # is not necessarily the python that bare `pip` targets —
          # install the regex helper into that interpreter.
          PYBIN=$(bundle exec ruby -e 'require "pycall"; v = PyCall.sys.version[/\d+\.\d+/]; puts "python#{v}"')
          "$PYBIN" -m pip install regex

      - name: RSpec
        working-directory: ruby
        run: bundle exec rspec

  standard:
    name: StandardRB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The Gemfile's path dependency needs ../maps to exist for bundler
      # to resolve; linting itself never loads it. actions/checkout
      # cannot write outside the workspace, hence the plain clone.
      - run: git clone --depth 1 https://github.com/interscript/maps ../maps
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec standardrb
