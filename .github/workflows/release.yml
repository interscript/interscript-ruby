name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    # Builds the gem FROM THIS REPO at the pushed tag and publishes it.
    # The previous workflow checked out the monorepo and shipped the
    # monorepo's ruby/ tree — the v3.2.0 gem therefore did not contain
    # this repo's decode fixes (512-step cap, UTF-8 scrub).
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Run the gem's own suite
        # the cross-compiler specs need the monorepo's js/ fixtures —
        # skip them here (the CI matrix covers them)
        run: SKIP_JS=1 SKIP_PYTHON=1 bundle exec rake

      - name: Build the gem
        run: |
          mkdir -p pkg
          gem build interscript.gemspec
          cp interscript-*.gem pkg/
          ls -la pkg/

      - name: Publish to rubygems.org (trusted publishing)
        # Org law: OIDC trusted publishing, never API-key tokens. Requires
        # the one-time rubygems.org trusted-publisher registration for
        # this repo + workflow (confirmed registered 2026-10-25).
        uses: rubygems/release-gem@v1
