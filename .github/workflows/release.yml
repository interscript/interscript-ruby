name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # RubyGems.org trusted publishing (OIDC)
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Test
        # Cross-compiler execution specs need the monorepo's sibling js/
        # assets; that coverage is owned by rake.yml's matrix on every
        # push, not by the release gate.
        env:
          SKIP_JS: "1"
          SKIP_PYTHON: "1"
        run: bundle exec rake
      - uses: rubygems/release-gem@v1
