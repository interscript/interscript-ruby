name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    # Builds the gem FROM THIS REPO at the pushed tag and publishes it.
    # The previous workflow checked out the monorepo and shipped the
    # monorepo's ruby/ tree — the v3.2.0 gem therefore did not contain
    # this repo's decode fixes (512-step cap, UTF-8 scrub).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Run the gem's own suite
        run: bundle exec rake

      - name: Build the gem
        run: |
          mkdir -p pkg
          gem build interscript.gemspec
          cp interscript-*.gem pkg/
          ls -la pkg/

      - name: Publish to rubygems.org
        env:
          RUBYGEMS_API_KEY: ${{ secrets.INTERSCRIPT_RUBYGEMS_API_KEY }}
        run: |
          mkdir -p ~/.gem
          printf -- "---\n:rubygems_api_key: %s\n" "$RUBYGEMS_API_KEY" > ~/.gem/credentials
          chmod 0600 ~/.gem/credentials
          gem push pkg/interscript-*.gem
